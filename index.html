<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#0a0d14" />

    <title>Bryson Richards — Software Engineer</title>
    <meta
      name="description"
      content="Portfolio of Bryson Richards, a software engineer. Selected projects, the stack behind them, and how to get in touch."
    />

    <!-- Link previews (update the URL once the site is deployed). -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Bryson Richards — Software Engineer" />
    <meta
      property="og:description"
      content="Selected projects, the stack behind them, and how to get in touch."
    />
    <meta name="twitter:card" content="summary_large_image" />

    <script>
      // Applies the saved theme before first paint so there is no light flash.
      try {
        var stored = localStorage.getItem('theme')
        document.documentElement.dataset.theme =
          stored === 'light' || stored === 'dark'
            ? stored
            : window.matchMedia('(prefers-color-scheme: light)').matches
              ? 'light'
              : 'dark'
      } catch (e) {
        document.documentElement.dataset.theme = 'dark'
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
